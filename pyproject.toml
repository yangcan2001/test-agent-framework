[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "test-agent"
version = "0.1.0"
description = "Plan-and-Solve + ReAct 混合架构的自主测试 Agent"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "jsonschema>=4.20",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.6",
    "playwright>=1.44",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
filterwarnings = ["ignore::pytest.PytestCollectionWarning"]
